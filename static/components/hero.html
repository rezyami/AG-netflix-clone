<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Component - Netflix Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'netflix-red': '#e50914',
                        'netflix-black': '#141414',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Arial', 'Helvetica', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #141414;
            color: #ffffff;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
        }

        :focus-visible {
            outline: 3px solid white;
            outline-offset: 2px;
            z-index: 50;
        }
    </style>
</head>

<body>
    <!-- Hero Section -->
    <div class="relative h-screen min-h-[80vh] w-full overflow-hidden">
        <!-- Background Layer -->
        <div class="absolute inset-0 bg-black">
            <!-- Background Image -->
            <img src="https://image.tmdb.org/t/p/original/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg" alt="Hero Background"
                class="w-full h-full object-cover" />

            <!-- Video Player (YouTube Embed Example) -->
            <!-- Uncomment to use video background -->
            <!--
            <div class="absolute inset-0 overflow-hidden pointer-events-none">
                <iframe
                    class="absolute top-1/2 left-1/2 h-[140%] w-[140%] -translate-x-1/2 -translate-y-1/2 object-cover"
                    src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1&controls=0&loop=1&playlist=VIDEO_ID&rel=0&showinfo=0&iv_load_policy=3&modestbranding=1&disablekb=1&fs=0"
                    allow="autoplay; encrypted-media"
                    title="Hero Video"
                ></iframe>
            </div>
            -->
        </div>

        <!-- Gradient Overlays -->
        <div class="absolute inset-0 bg-gradient-to-r from-[#141414] via-transparent to-transparent opacity-90"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#141414] via-transparent to-transparent opacity-90"></div>
        <div class="absolute bottom-0 h-32 w-full bg-gradient-to-t from-[#141414] to-transparent"></div>

        <!-- Content -->
        <div class="absolute bottom-[30%] left-4 md:left-16 max-w-xl space-y-6 z-10">
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold text-white drop-shadow-2xl tracking-tight">
                Stranger Things
            </h1>
            <p class="text-base md:text-lg text-white drop-shadow-md line-clamp-3 font-medium">
                When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying
                supernatural forces and one strange little girl.
            </p>
            <div class="flex items-center gap-4">
                <!-- Play Button -->
                <button
                    class="inline-flex items-center justify-center rounded-md font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white bg-white text-black hover:bg-white/90 px-8 py-6 text-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="mr-2 h-5 w-5">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    Play
                </button>

                <!-- More Info Button -->
                <button
                    class="inline-flex items-center justify-center rounded-md font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white bg-gray-500/40 hover:bg-gray-500/30 text-white px-8 py-6 text-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="mr-2 h-5 w-5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 16v-4"></path>
                        <path d="M12 8h.01"></path>
                    </svg>
                    More Info
                </button>
            </div>
        </div>

        <!-- Mute Control & Rating -->
        <div class="absolute bottom-[35%] right-0 flex items-center gap-4 z-20">
            <button onclick="toggleMute()"
                class="rounded-full border border-white/50 p-2.5 text-white hover:bg-white/10 hover:border-white transition bg-black/30 backdrop-blur-sm"
                aria-label="Toggle Mute">
                <svg id="mute-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="h-5 w-5">
                    <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
                    <line x1="22" x2="16" y1="9" y2="15"></line>
                    <line x1="16" x2="22" y1="9" y2="15"></line>
                </svg>
            </button>
            <div
                class="bg-gray-500/30 border-l-4 border-white py-1 pl-3 pr-8 text-white backdrop-blur-sm font-semibold">
                13+
            </div>
        </div>
    </div>

    <script>
        let isMuted = true;

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('mute-icon');

            if (isMuted) {
                // Muted icon (X)
                icon.innerHTML = `
                    <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
                    <line x1="22" x2="16" y1="9" y2="15"></line>
                    <line x1="16" x2="22" y1="9" y2="15"></line>
                `;
            } else {
                // Unmuted icon (Volume)
                icon.innerHTML = `
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                `;
            }
        }
    </script>
</body>

</html>
