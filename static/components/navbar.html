<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Component - Netflix Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'netflix-red': '#e50914',
                        'netflix-black': '#141414',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Arial', 'Helvetica', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #141414;
            color: #ffffff;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
        }

        :focus-visible {
            outline: 3px solid white;
            outline-offset: 2px;
            z-index: 50;
        }

        .side-menu {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }

        .side-menu.open {
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="fixed top-0 z-50 w-full transition-all duration-300 bg-gradient-to-b from-black to-transparent">
        <div class="flex items-center justify-between px-4 md:px-16 py-4">
            <!-- Menu Button & Logo -->
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="p-2 rounded-md hover:bg-white/10 transition-colors"
                    aria-label="Toggle Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" x2="20" y1="12" y2="12"></line>
                        <line x1="4" x2="20" y1="6" y2="6"></line>
                        <line x1="4" x2="20" y1="18" y2="18"></line>
                    </svg>
                </button>
                <h1 class="text-netflix-red text-2xl md:text-4xl font-bold tracking-tight">NETFLIX</h1>
            </div>
        </div>
    </nav>

    <!-- Side Menu -->
    <div id="sideMenu"
        class="side-menu fixed left-0 top-0 h-full bg-black/95 backdrop-blur-md z-40 border-r border-gray-800">
        <div class="p-6 space-y-6">
            <!-- Close Button -->
            <button onclick="toggleMenu()" class="p-2 rounded-md hover:bg-white/10 transition-colors mb-4"
                aria-label="Close Menu">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                </svg>
            </button>

            <!-- Menu Items -->
            <nav class="space-y-2">
                <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-md hover:bg-white/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span class="text-lg font-medium">Home</span>
                </a>

                <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-md hover:bg-white/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6">
                        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                        <path d="M7 3v18"></path>
                        <path d="M3 7.5h4"></path>
                        <path d="M3 12h18"></path>
                        <path d="M3 16.5h4"></path>
                        <path d="M17 3v18"></path>
                        <path d="M17 7.5h4"></path>
                        <path d="M17 16.5h4"></path>
                    </svg>
                    <span class="text-lg font-medium">Movies</span>
                </a>

                <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-md hover:bg-white/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6">
                        <rect width="20" height="15" x="2" y="7" rx="2" ry="2"></rect>
                        <polyline points="17 2 12 7 7 2"></polyline>
                    </svg>
                    <span class="text-lg font-medium">TV Shows</span>
                </a>

                <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-md hover:bg-white/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="10 8 16 12 10 16 10 8"></polygon>
                    </svg>
                    <span class="text-lg font-medium">New & Popular</span>
                </a>

                <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-md hover:bg-white/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span class="text-lg font-medium">My List</span>
                </a>

                <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-md hover:bg-white/10 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="w-6 h-6">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                    </svg>
                    <span class="text-lg font-medium">Search</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-30 hidden" onclick="toggleMenu()"></div>

    <!-- Demo Content -->
    <div class="pt-24 px-4 md:px-16">
        <h2 class="text-3xl font-bold mb-4">Navbar Component</h2>
        <p class="text-gray-400 mb-8">Click the menu icon to toggle the side navigation</p>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');

            menu.classList.toggle('open');
            overlay.classList.toggle('hidden');
        }
    </script>
</body>

</html>
